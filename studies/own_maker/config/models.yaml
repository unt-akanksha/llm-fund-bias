# Models for the own-maker study. Same structure as the repo's config/models.yaml so
# src/providers.py can be reused unchanged. Groq entries are added in Part C, after
# checking the live /models list; limits are editable (null = runner refuses to start).

defaults:
  params:
    temperature: 1.0
    max_tokens: 400
    num_ctx: 2048

providers:
  ollama:
    base_url: http://localhost:11434/v1
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY

stage1_runs_per_prompt: 50

models:
  llama3.1-8b:
    provider: ollama
    model_id: llama3.1:8b
    enabled: true
  qwen2.5-7b:
    provider: ollama
    model_id: qwen2.5:7b
    enabled: true

  # Groq (Part C). Model ids verified against the live /models list on 2026-10-11.
  # Limits: copy from https://console.groq.com/settings/limits (null = runner refuses to start).
  groq-qwen3.8-27b:
    provider: groq
    model_id: qwen/qwen3.8-27b
    enabled: false
    limits:
      requests_per_min: null
      requests_per_day: null
      tokens_per_min: null
      tokens_per_day: null

  # Secondary / exploratory: OpenAI is not listed; MSFT is the proxy (see own_company.yaml).
  groq-gpt-oss-120b:
    provider: groq
    model_id: openai/gpt-oss-120b
    enabled: false
    reasoning_effort: null   # reasoning model: check in a 3-call smoke that 400 output tokens suffice
    limits:
      requests_per_min: null
      requests_per_day: null
      tokens_per_min: null
      tokens_per_day: null
