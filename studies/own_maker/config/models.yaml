# Models for the own-maker study. Same structure as the repo's config/models.yaml so
# src/providers.py can be reused unchanged. Groq entries are added in Part C, after
# checking the live /models list; limits are editable (null = runner refuses to start).

defaults:
  params:
    temperature: 1.0
    max_tokens: 400
    num_ctx: 2048

providers:
  ollama:
    base_url: http://localhost:11434/v1
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY

stage1_runs_per_prompt: 50

models:
  llama3.1-8b:
    provider: ollama
    model_id: llama3.1:8b
    enabled: true
  qwen2.5-7b:
    provider: ollama
    model_id: qwen2.5:7b
    enabled: true

  # Groq (Part C). Model ids verified against the live /models list on 2026-10-11.
  groq-qwen3.8-27b:
    provider: groq
    model_id: qwen/qwen3.8-27b
    enabled: true
    limits:                  # from the author's Groq console, 2026-10-11
      requests_per_min: 30
      requests_per_day: 1000
      tokens_per_min: 8000
      tokens_per_day: 200000

  # Secondary / exploratory: OpenAI is not listed; MSFT is the proxy (see own_company.yaml).
  groq-gpt-oss-120b:
    provider: groq
    model_id: openai/gpt-oss-120b
    enabled: true
    reasoning_effort: null   # Groq default
    params:
      # Raised from the 400 default for this model only: in a 3-call smoke (2026-10-11, phase
      # groqsmoke) hidden reasoning used 218-325 tokens and 2 of 3 answers were cut off
      # (finish_reason=length; one HTTP 400 json_validate_failed). Smoke calls are not analyzed.
      max_tokens: 1200
    limits:                  # from the author's Groq console, 2026-10-11
      requests_per_min: 30
      requests_per_day: 1000
      tokens_per_min: 8000
      tokens_per_day: 200000
